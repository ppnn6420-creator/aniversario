<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>A Subida da Bolinha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;900&display=swap">
<style>
/* Tela única de jogo: canvas retrato 480x800 escalado; controles de toque por baixo no celular */
:root {
  --night: #120a24;
  --ink: #1d1430;
  --gold: #ffcc4d;
  --leaf: #3ddc6b;
  --btn: rgba(255, 255, 255, 0.16);
  --btn-line: rgba(255, 255, 255, 0.45);
  --btn-text: #ffffff;
  --display: 'Lilita One', 'Arial Black', system-ui, sans-serif;
  --body: 'Nunito', system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--night); color: var(--btn-text);
  overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent; font-family: var(--body);
}
#wrap { position: fixed; inset: 0; display: flex; justify-content: center; align-items: center; }
* { -webkit-touch-callout: none; }
[hidden] { display: none !important; }
canvas { display: block; outline: none; }
#touch {
  position: fixed; left: 0; right: 0; bottom: 0;
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  pointer-events: none;
}
#touch .group { display: flex; gap: 14px; }
#touch button {
  pointer-events: auto; width: 78px; height: 78px; border-radius: 50%;
  border: 2px solid var(--btn-line); background: var(--btn); color: var(--btn-text);
  font-family: var(--display); font-size: 30px; touch-action: none;
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
}
#touch button:active, #touch button.on { background: rgba(255, 255, 255, 0.35); }
#touch #bj { width: 104px; height: 104px; font-size: 22px; background: rgba(61, 220, 107, 0.35); border-color: var(--leaf); }
</style>

<div id="wrap"><canvas id="c" tabindex="0"></canvas></div>
<div id="touch" hidden>
  <div class="group">
    <button id="bl" aria-label="Andar para a esquerda">◀</button>
    <button id="br" aria-label="Andar para a direita">▶</button>
  </div>
  <button id="bj" aria-label="Pular">PULAR</button>
</div>

<script>
'use strict';
// Nome do aniversariante (deixe vazio para mostrar "mano")
const NOME = '';

// Largura lógica fixa; a altura acompanha o formato da tela (celular em pé usa a tela toda)
const W = 480;
let H = 800;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const touchUI = document.getElementById('touch');
const isTouch = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
const FD = "'Lilita One', 'Arial Black', sans-serif", FB = "'Nunito', system-ui, sans-serif";
// espaço que os botões de toque ocupam embaixo, em unidades do jogo
const BOTTOM_PAD = isTouch ? 230 : 60;
const groundCam = () => -H + BOTTOM_PAD;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const vw = innerWidth, vh = innerHeight;
  H = vh > vw ? Math.round(Math.min(1100, Math.max(700, W * vh / vw))) : 800;
  const s = Math.min(vw / W, vh / H);
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
  cv.width = Math.round(W * s * dpr); cv.height = Math.round(H * s * dpr);
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
}
addEventListener('resize', resize); resize();

// ---------- utilidades ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smooth = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (a, b, t) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',')})`; };
function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); }
function wrapLines(text, maxW) {
  const words = text.split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur); return lines;
}
function outlined(text, x, y, fill, stroke, lw) { ctx.lineJoin = 'round'; ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.strokeText(text, x, y); ctx.fillStyle = fill; ctx.fillText(text, x, y); }

// ---------- som ----------
let AC = null, master = null, muted = false;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination); } catch (e) { AC = null; }
}
function tone(f, d, type = 'sine', v = 0.2, when = 0, f2 = null) {
  if (!AC) return;
  const t = AC.currentTime + when, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + d + 0.05);
}
const sfx = {
  jump: () => tone(320, 0.18, 'square', 0.07, 0, 640),
  land: () => tone(150, 0.07, 'sine', 0.1),
  hit: () => { tone(200, 0.35, 'sawtooth', 0.12, 0, 55); tone(90, 0.3, 'square', 0.06); },
  level: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.22, 'triangle', 0.14, i * 0.09)),
  gate: () => [392, 494, 587, 784, 988, 1175].forEach((f, i) => tone(f, 0.8, 'sine', 0.12, i * 0.28)),
  click: () => tone(620, 0.06, 'square', 0.05),
};
const NOTE = { G4: 392, A4: 440, B4: 493.88, C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99 };
const BDAY = [['G4', .75], ['G4', .25], ['A4', 1], ['G4', 1], ['C5', 1], ['B4', 2], ['G4', .75], ['G4', .25], ['A4', 1], ['G4', 1], ['D5', 1], ['C5', 2],
  ['G4', .75], ['G4', .25], ['G5', 1], ['E5', 1], ['C5', 1], ['B4', 1], ['A4', 2], ['F5', .75], ['F5', .25], ['E5', 1], ['C5', 1], ['D5', 1], ['C5', 3]];
function playBirthday() {
  if (!AC) return; const beat = 0.42; let t = 0.15;
  for (const [n, b] of BDAY) { tone(NOTE[n], b * beat * 0.95, 'triangle', 0.22, t); tone(NOTE[n] / 2, b * beat * 0.9, 'sine', 0.09, t); t += b * beat; }
}
function toggleMute() { muted = !muted; if (master) master.gain.value = muted ? 0 : 0.5; }

// ---------- níveis ----------
const LEVELS = [
  { name: 'A Terra', plat: 'grass', obs: 'bird', top: '#7cc8ff', bot: '#e0f5ff', n: 4, spd: 75, w: [110, 150], move: 0, gap: [88, 112], stars: 0 },
  { name: 'Os Prédios', plat: 'building', obs: 'heli', top: '#5aa9e8', bot: '#cfe8ff', n: 5, spd: 95, w: [100, 135], move: 0.12, gap: [95, 118], stars: 0 },
  { name: 'O Céu', plat: 'cloud', obs: 'plane', top: '#2f86dc', bot: '#a3d4ff', n: 5, spd: 110, w: [95, 130], move: 0.25, gap: [98, 124], stars: 0 },
  { name: 'O Espaço', plat: 'asteroid', obs: 'satellite', top: '#060a24', bot: '#1a2766', n: 5, spd: 100, w: [90, 120], move: 0.3, gap: [100, 126], stars: 1, meteors: true },
  { name: 'As Galáxias', plat: 'crystal', obs: 'comet', top: '#12062b', bot: '#3d1569', n: 6, spd: 120, w: [88, 115], move: 0.35, gap: [100, 128], stars: 1, meteors: true },
  { name: 'O Universo', plat: 'star', obs: 'hole', top: '#03010a', bot: '#170836', n: 6, spd: 1, w: [85, 110], move: 0.4, gap: [100, 128], stars: 1 },
  { name: 'O Paraíso', plat: 'gold', obs: 'orb', top: '#ffe7a3', bot: '#ffd0ec', n: 4, spd: 70, w: [95, 125], move: 0.3, gap: [95, 118], stars: 0.15 },
];
const LEVEL_H = 2300;
const G = 1900, JUMP = 840, SPEED = 290;

let plats = [], obstacles = [], cps = [], finalPlat = null;
function buildWorld() {
  const rnd = mulberry32(20261029);
  plats = []; obstacles = []; cps = [];
  const ground = { x: 0, y: 0, w: W, h: 40, type: 'grass', base: true, lvl: 0, bx: 0, amp: 0, dx: 0 };
  plats.push(ground); cps[0] = ground;
  let y = 0, px = W / 2;
  for (let L = 0; L < 7; L++) {
    const lv = LEVELS[L], top = -(L + 1) * LEVEL_H, start = plats.length;
    if (L > 0) {
      y -= 112;
      const cp = { x: W / 2 - 110, y, w: 220, h: 20, type: lv.plat, lvl: L, bx: W / 2 - 110, amp: 0, dx: 0, cp: true, seed: rnd() };
      // o checkpoint de asteroide/cristal também precisa do contorno, senão o desenho quebra
      if (lv.plat === 'asteroid' || lv.plat === 'crystal') cp.pts = Array.from({ length: 10 }, (_, i) => { const a = i / 10 * Math.PI * 2; return [Math.cos(a) * 0.96, Math.sin(a) < 0 ? -0.5 : 0.85]; });
      plats.push(cp); cps[L] = cp; px = W / 2;
    }
    while (y - lv.gap[1] > top) {
      y -= lv.gap[0] + rnd() * (lv.gap[1] - lv.gap[0]);
      const w = lv.w[0] + rnd() * (lv.w[1] - lv.w[0]);
      let cx = px + (rnd() * 2 - 1) * 180;
      if (Math.abs(cx - px) < 50) cx = px + (cx >= px ? 1 : -1) * (50 + rnd() * 80);
      cx = clamp(cx, w / 2 + 8, W - w / 2 - 8);
      const bx = cx - w / 2;
      let amp = rnd() < lv.move ? 40 + rnd() * 50 : 0;
      amp = Math.min(amp, bx - 6, W - (bx + w) - 6); if (amp < 25) amp = 0;
      const p = { x: bx, y, w, h: 20, type: lv.plat, lvl: L, bx, amp, spd: 0.7 + rnd() * 0.8, ph: rnd() * 6.28, dx: 0, seed: rnd() };
      if (lv.plat === 'asteroid' || lv.plat === 'crystal') {
        p.pts = []; const n = 10;
        for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; p.pts.push([Math.cos(a) * (0.88 + rnd() * 0.16), Math.sin(a) < 0 ? -0.5 : 0.6 + rnd() * 0.5]); }
      }
      plats.push(p); px = cx;
    }
    // obstáculos distribuídos pelo nível
    const pool = plats.slice(start + 3, plats.length - 1);
    for (let k = 0; k < lv.n && pool.length; k++) {
      const p = pool[Math.floor((k + 0.5) / lv.n * pool.length)];
      const dir = rnd() < 0.5 ? -1 : 1;
      const r = { bird: 14, heli: 18, plane: 18, satellite: 17, comet: 15, hole: 22, orb: 15 }[lv.obs];
      obstacles.push({ type: lv.obs, x: 40 + rnd() * (W - 80), y: p.y - 55, by: p.y - 55, r, vx: dir * lv.spd * (0.8 + rnd() * 0.4), ph: rnd() * 6.28, spd: 0.8 + rnd() * 0.5 });
    }
  }
  y -= 120;
  finalPlat = { x: 0, y, w: W, h: 40, type: 'gate', lvl: 6, bx: 0, amp: 0, dx: 0, final: true };
  plats.push(finalPlat);
}

// ---------- estado ----------
let state = 'title', T = 0, camY = -H + 60, shake = 0;
let P, hearts, playTime, meteors, warns, meteorTimer, particles, confetti, balloons, banner, toast, reached;
let sceneI = 0, sceneT = 0, et = 0, ft = 0, gateOpen = 0, flash = 0, gateSoundDone = false;
let uiButtons = [], uiOY = 0;
const keys = { left: false, right: false };

function resetGame() {
  buildWorld();
  P = { x: W / 2, y: -16, vx: 0, vy: 0, r: 16, ground: plats[0], safe: plats[0], buffer: 0, coyote: 0, face: 1, sq: 1, inv: 0 };
  hearts = 3; playTime = 0; meteors = []; warns = []; meteorTimer = 3; particles = []; confetti = []; banner = null; toast = null; reached = -1;
  gateOpen = 0; flash = 0; et = 0; ft = 0; gateSoundDone = false; camY = groundCam();
}
resetGame();

function startPlay() { state = 'play'; reached = -1; enterLevel(0); setTouch(); cv.focus(); }
function enterLevel(L) { if (L <= reached) return; reached = L; banner = { L, t: 0 }; hearts = 3; if (L > 0) sfx.level(); }
function setTouch() { touchUI.hidden = !(isTouch && state === 'play'); }

// ---------- intro ----------
const SCENES = [
  { cam: 'ground', d: 4, look: [0, 0], text: 'Era uma vez uma bolinha verde que morava aqui na Terra...' },
  { cam: 'fly', d: 7.5, look: [0, -1], text: 'Todo dia ela olhava pra cima e sonhava alto: os prédios, o céu, o espaço, as galáxias, o universo inteiro!' },
  { cam: 'gate', d: 4, text: 'Dizem que lá no topo de tudo existe o Paraíso, com um portão dourado guardando uma surpresa muito especial.' },
  { cam: 'ground', d: 4, look: [1, -0.4], brave: true, text: 'Então ela decidiu: hoje eu chego lá! Pulando em prédios, nuvens e asteroides, desviando de tudo pelo caminho.' },
  { cam: 'ground', d: 9999, look: [0, -0.5], controls: true, text: '' },
];
function sceneTextDone() { const s = SCENES[sceneI]; return sceneT * 42 >= s.text.length; }
function advance() {
  initAudio();
  if (state === 'title') { state = 'intro'; sceneI = 0; sceneT = 0; sfx.click(); return; }
  if (state === 'intro') {
    const s = SCENES[sceneI];
    if (s.controls) { startPlay(); return; }
    if (!sceneTextDone()) { sceneT = s.text.length / 42 + 0.01; return; }
    sceneI++; sceneT = 0; sfx.click();
  }
}

// ---------- entrada ----------
function pressJump() { initAudio(); if (state === 'play') P.buffer = 0.12; else if (state === 'title' || state === 'intro') advance(); }
addEventListener('keydown', e => {
  const k = e.key;
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(k)) e.preventDefault();
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = true;
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = true;
  else if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W') { if (!e.repeat) pressJump(); }
  else if (k === 'Enter') { if (state === 'intro') startPlay(); else if (state === 'title') advance(); }
  else if (k === 'Escape' && state === 'intro') startPlay();
  else if (k === 'm' || k === 'M') toggleMute();
});
addEventListener('keyup', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = false;
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = false;
});
addEventListener('blur', () => { keys.left = keys.right = false; });
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); initAudio();
  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
  for (const b of uiButtons) if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { b.fn(); return; }
  pressJump();
});
function holdBtn(id, key) {
  const el = document.getElementById(id);
  const on = e => { e.preventDefault(); keys[key] = true; el.classList.add('on'); };
  const off = e => { keys[key] = false; el.classList.remove('on'); };
  el.addEventListener('pointerdown', on); el.addEventListener('pointerup', off); el.addEventListener('pointercancel', off); el.addEventListener('pointerleave', off);
}
holdBtn('bl', 'left'); holdBtn('br', 'right');
document.getElementById('bj').addEventListener('pointerdown', e => { e.preventDefault(); pressJump(); });
document.addEventListener('contextmenu', e => e.preventDefault());

// ---------- partículas ----------
function burst(x, y, color, n, spd = 220) {
  for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, s = spd * (0.3 + Math.random() * 0.7); particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.6 + Math.random() * 0.4, max: 1, color, size: 2 + Math.random() * 3 }); }
}

// ---------- atualização ----------
function updatePlatforms() {
  for (const p of plats) if (p.amp) { const nx = p.bx + Math.sin(T * p.spd + p.ph) * p.amp; p.dx = nx - p.x; p.x = nx; }
}
function updateObstacles(dt) {
  for (const o of obstacles) {
    if (o.type === 'hole') { o.x = W / 2 + Math.sin(T * o.spd + o.ph) * 170; o.y = o.by + Math.sin(T * 1.7 + o.ph) * 5; continue; }
    o.x += o.vx * dt;
    if (o.x < o.r) { o.x = o.r; o.vx = Math.abs(o.vx); } else if (o.x > W - o.r) { o.x = W - o.r; o.vx = -Math.abs(o.vx); }
    o.y = o.by + Math.sin(T * (o.type === 'orb' ? 2 : 3) + o.ph) * (o.type === 'orb' ? 18 : 6);
  }
}
function placeOn(p) { P.x = p.x + p.w / 2; P.y = p.y - P.r; P.vx = 0; P.vy = 0; P.ground = p; P.safe = p; }
function hurt(kind, o) {
  hearts--; sfx.hit(); shake = 0.35; burst(P.x, P.y, '#ff5d7a', 16);
  if (hearts <= 0) {
    hearts = 3; placeOn(cps[P.safe.lvl]); meteors = []; warns = [];
    toast = { text: 'Ops! De volta ao começo do nível', t: 0 };
  } else if (kind === 'fall') {
    placeOn(P.safe); toast = { text: 'Caiu! Perdeu um coração', t: 0 };
  } else {
    P.vy = -320; P.vx = (P.x < o.x ? -1 : 1) * 260; P.ground = null;
  }
  P.inv = 1.6;
}
function updatePlayer(dt) {
  const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  P.vx += (dir * SPEED - P.vx) * Math.min(1, dt * (P.ground ? 16 : 9));
  if (dir) P.face = dir;
  if (P.buffer > 0) P.buffer -= dt;
  P.coyote = P.ground ? 0.09 : P.coyote - dt;
  if (P.buffer > 0 && P.coyote > 0) {
    P.vy = -JUMP; P.ground = null; P.coyote = 0; P.buffer = 0; P.sq = 0.75; sfx.jump();
    burst(P.x, P.y + P.r, 'rgba(255,255,255,0.8)', 6, 90);
  }
  if (P.ground) P.x += P.ground.dx;
  const wasGround = !!P.ground;
  P.vy = Math.min(P.vy + G * dt, 1100);
  const prevBottom = P.y + P.r;
  P.x = clamp(P.x + P.vx * dt, P.r, W - P.r);
  P.y += P.vy * dt;
  P.ground = null;
  if (P.vy >= 0) {
    for (const p of plats) {
      if (p.y < P.y - 60 || p.y > P.y + 80) continue;
      if (P.x + P.r * 0.6 > p.x && P.x - P.r * 0.6 < p.x + p.w && prevBottom <= p.y + 2 && P.y + P.r >= p.y) {
        P.y = p.y - P.r; P.vy = 0; P.ground = p;
        if (!wasGround) { P.sq = 1.3; sfx.land(); }
        P.safe = p;
        if (p.lvl > reached) enterLevel(p.lvl);
        if (p.final) startEnding();
        break;
      }
    }
  }
  P.sq += (1 - P.sq) * Math.min(1, dt * 10);
  if (P.inv > 0) P.inv -= dt;
  if (!P.ground && P.y > P.safe.y + 480) { hurt('fall'); return; }
  if (P.inv <= 0) {
    for (const o of obstacles) { if (Math.abs(o.y - P.y) > 60) continue; if (Math.hypot(o.x - P.x, o.y - P.y) < P.r * 0.8 + o.r) { hurt('hit', o); return; } }
    for (const m of meteors) if (Math.hypot(m.x - P.x, m.y - P.y) < P.r * 0.8 + m.r) { hurt('hit', m); return; }
  }
}
function updateMeteors(dt) {
  const L = P.safe.lvl;
  if (LEVELS[L].meteors && state === 'play') {
    meteorTimer -= dt;
    if (meteorTimer <= 0) { meteorTimer = 2.6 + Math.random() * 2.2; warns.push({ x: 30 + Math.random() * (W - 60), t: 1 }); }
  }
  for (const w of warns) { w.t -= dt; if (w.t <= 0) meteors.push({ x: w.x, y: camY - 40, vx: (Math.random() - 0.5) * 90, vy: 300, r: 13 }); }
  warns = warns.filter(w => w.t > 0);
  for (const m of meteors) { m.x += m.vx * dt; m.y += m.vy * dt; }
  meteors = meteors.filter(m => m.y < camY + H + 60);
}
function startEnding() {
  if (state !== 'play') return;
  state = 'ending'; et = 0; keys.left = keys.right = false; setTouch();
}

  ctx.restore();
}
function drawMeteor(m, cam) {
  const x = m.x, y = m.y - cam;
  const tg = ctx.createLinearGradient(x, y, x - m.vx * 0.25, y - 70); tg.addColorStop(0, 'rgba(255,170,60,0.9)'); tg.addColorStop(1, 'rgba(255,80,40,0)');
  ctx.fillStyle = tg; ctx.beginPath(); ctx.moveTo(x - 11, y); ctx.lineTo(x - m.vx * 0.25, y - 75); ctx.lineTo(x + 11, y); ctx.fill();
  ctx.fillStyle = '#7b4a2e'; circle(x, y, m.r); ctx.fill(); ctx.fillStyle = '#5a321e'; circle(x - 4, y - 3, 4); ctx.fill(); circle(x + 5, y + 4, 3); ctx.fill();
}

// ---------- bolinha ----------
function drawBall(x, y, r, o = {}) {
  const sq = o.sq || 1;
  ctx.save(); ctx.translate(x, y + r); ctx.scale(sq, 1 / sq); ctx.translate(0, -r);
  ctx.fillStyle = 'rgba(0,0,0,0.12)'; ctx.beginPath(); ctx.ellipse(0, r - 1, r * 0.8, r * 0.18, 0, 0, 7); ctx.fill();
  const g = ctx.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.1, 0, 0, r);
  g.addColorStop(0, '#c4ffd0'); g.addColorStop(0.45, '#43e06a'); g.addColorStop(1, '#169c3e');
  ctx.fillStyle = g; circle(0, 0, r); ctx.fill(); ctx.lineWidth = Math.max(2, r * 0.13); ctx.strokeStyle = '#0d6b2a'; ctx.stroke();
  const lx = (o.lookX || 0) * r * 0.2, ly = (o.lookY || 0) * r * 0.2;
  const blink = (T % 3.7) < 0.12;
  for (const s of [-1, 1]) {
    const ex = s * r * 0.32 + lx * 0.6, ey = -r * 0.12 + ly * 0.5;
    if (blink) { ctx.strokeStyle = '#14202b'; ctx.lineWidth = r * 0.1; ctx.beginPath(); ctx.moveTo(ex - r * 0.18, ey); ctx.lineTo(ex + r * 0.18, ey); ctx.stroke(); }
    else {
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.ellipse(ex, ey, r * 0.22, r * 0.27, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#14202b'; circle(ex + lx * 0.5, ey + ly * 0.5, r * 0.12); ctx.fill();
      ctx.fillStyle = '#ffffff'; circle(ex + lx * 0.5 + r * 0.04, ey + ly * 0.5 - r * 0.05, r * 0.04); ctx.fill();
    }
    if (o.brave) { ctx.strokeStyle = '#0d4a1f'; ctx.lineWidth = r * 0.09; ctx.beginPath(); ctx.moveTo(ex - s * r * 0.2, ey - r * 0.42); ctx.lineTo(ex + s * r * 0.18, ey - r * 0.3); ctx.stroke(); }
  }
  ctx.fillStyle = 'rgba(255,120,150,0.55)'; ctx.beginPath(); ctx.ellipse(-r * 0.58, r * 0.22, r * 0.14, r * 0.09, 0, 0, 7); ctx.fill(); ctx.beginPath(); ctx.ellipse(r * 0.58, r * 0.22, r * 0.14, r * 0.09, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = '#0d4a1f'; ctx.lineWidth = Math.max(1.5, r * 0.09); ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(lx * 0.3, r * 0.18, r * 0.22, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
  if (o.hat) {
    ctx.save(); ctx.translate(r * 0.1, -r * 0.82); ctx.rotate(0.15);
    ctx.fillStyle = '#ff5fa2'; ctx.beginPath(); ctx.moveTo(-r * 0.45, 0); ctx.lineTo(r * 0.45, 0); ctx.lineTo(0, -r * 1.1); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#ffd34d'; ctx.lineWidth = r * 0.1; ctx.beginPath(); ctx.moveTo(-r * 0.3, -r * 0.3); ctx.lineTo(r * 0.3, -r * 0.3); ctx.moveTo(-r * 0.16, -r * 0.65); ctx.lineTo(r * 0.16, -r * 0.65); ctx.stroke();
    ctx.fillStyle = '#ffd34d'; circle(0, -r * 1.12, r * 0.16); ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

// ---------- mundo, HUD, telas ----------
function drawWorld(cam) {
  drawBackground(cam);
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake * 24, (Math.random() - 0.5) * shake * 24);
  for (const p of plats) { const sy = p.y - cam; if (sy > -320 && sy < H + 30) drawPlat(p, cam); }
  for (const o of obstacles) { const sy = o.y - cam; if (sy > -60 && sy < H + 60) drawObstacle(o, cam); }
  for (const m of meteors) drawMeteor(m, cam);
  if (state === 'play' || state === 'ending') {
    if (!(P.inv > 0 && Math.floor(P.inv * 10) % 2)) drawBall(P.x, P.y - cam, P.r, { sq: P.sq, lookX: P.face * (Math.abs(P.vx) > 30 ? 1 : 0.3), lookY: P.vy < -100 ? -0.8 : P.vy > 300 ? 0.7 : 0 });
  }
  for (const p of particles) { ctx.globalAlpha = clamp(p.life, 0, 1); ctx.fillStyle = p.color; ctx.fillRect(p.x - p.size / 2, p.y - cam - p.size / 2, p.size, p.size); }
  ctx.globalAlpha = 1;
  ctx.restore();
  for (const w of warns) {
    if (Math.floor(w.t * 8) % 2) continue;
    ctx.fillStyle = '#ff4d4d'; ctx.beginPath(); ctx.moveTo(w.x, 92); ctx.lineTo(w.x - 16, 120); ctx.lineTo(w.x + 16, 120); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffffff'; ctx.font = `20px ${FD}`; ctx.textAlign = 'center'; ctx.fillText('!', w.x, 117);
  }
}
function heart(x, y, s, fill) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.beginPath(); ctx.moveTo(0, 6); ctx.bezierCurveTo(-14, -4, -8, -16, 0, -8); ctx.bezierCurveTo(8, -16, 14, -4, 0, 6); ctx.closePath();
  ctx.fillStyle = fill ? '#ff4d6d' : 'rgba(255,255,255,0.25)'; ctx.fill(); ctx.lineWidth = 1.6; ctx.strokeStyle = 'rgba(40,10,30,0.6)'; ctx.stroke(); ctx.restore();
}
function fmtTime(s) { const m = Math.floor(s / 60), r = Math.floor(s % 60); return `${m}:${String(r).padStart(2, '0')}`; }
function drawHUD() {
  const L = P.safe.lvl, dark = LEVELS[L].stars >= 1;
  ctx.fillStyle = 'rgba(15,10,35,0.45)'; rr(10, 10, 168, 52, 14); ctx.fill();
  ctx.textAlign = 'left'; ctx.fillStyle = '#ffffff'; ctx.font = `20px ${FD}`; ctx.fillText(LEVELS[L].name, 22, 34);
  ctx.font = `700 13px ${FB}`; ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.fillText(`Nível ${L + 1} de 7`, 22, 52);
  ctx.fillStyle = 'rgba(15,10,35,0.45)'; rr(W / 2 - 42, 10, 84, 34, 12); ctx.fill();
  ctx.textAlign = 'center'; ctx.fillStyle = '#ffffff'; ctx.font = `20px ${FD}`; ctx.fillText(fmtTime(playTime), W / 2, 34);
  ctx.fillStyle = 'rgba(15,10,35,0.45)'; rr(W - 118, 10, 108, 34, 12); ctx.fill();
  for (let k = 0; k < 3; k++) heart(W - 94 + k * 30, 28, 1.05, k < hearts);
  // botão de som
  ctx.fillStyle = 'rgba(15,10,35,0.45)'; circle(W - 28, 70, 17); ctx.fill();
  ctx.fillStyle = '#ffffff'; ctx.font = `18px ${FD}`; ctx.fillText('♪', W - 28, 77);
  if (muted) { ctx.strokeStyle = '#ff4d6d'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(W - 40, 58); ctx.lineTo(W - 16, 82); ctx.stroke(); }
  uiButtons.push({ x: W - 48, y: 50, w: 40, h: 40, fn: toggleMute });
  // barra de progresso
  const by0 = H - 150, by1 = 110, bx = W - 16;
  for (let k = 0; k < 7; k++) { ctx.fillStyle = LEVELS[k].bot; ctx.fillRect(bx - 3, by0 + (by1 - by0) * (k / 7), 6, (by1 - by0) / 7); }
  ctx.strokeStyle = 'rgba(15,10,35,0.5)'; ctx.lineWidth = 1.5; ctx.strokeRect(bx - 3, by1, 6, by0 - by1);
  const prog = clamp(P.y / finalPlat.y, 0, 1);
  drawBall(bx, by0 + (by1 - by0) * prog - 7, 7, {});
  ctx.fillStyle = '#ffd34d'; ctx.font = `14px ${FD}`; ctx.fillText('★', bx, by1 - 6);
  // faixa de nível
  if (banner) {
    const a = smooth(banner.t / 0.3) * (1 - smooth((banner.t - 2.2) / 0.6));
    ctx.globalAlpha = a; ctx.textAlign = 'center';
    ctx.font = `700 18px ${FB}`; outlined(`NÍVEL ${banner.L + 1}`, W / 2, 250, '#ffffff', 'rgba(20,10,40,0.8)', 5);
    ctx.font = `52px ${FD}`; outlined(LEVELS[banner.L].name, W / 2, 302, '#ffe066', '#3a1d5c', 10);
    ctx.globalAlpha = 1;
  }
  if (toast) {
    ctx.globalAlpha = 1 - smooth((toast.t - 1.5) / 0.5); ctx.textAlign = 'center'; ctx.font = `700 18px ${FB}`;
    const tw = ctx.measureText(toast.text).width + 32; ctx.fillStyle = 'rgba(200,30,70,0.85)'; rr(W / 2 - tw / 2, 340, tw, 38, 19); ctx.fill();
    ctx.fillStyle = '#ffffff'; ctx.fillText(toast.text, W / 2, 365); ctx.globalAlpha = 1;
  }
}
function textBox(text, shown, done) {
  const y = H - 220, h = 160;
  ctx.fillStyle = 'rgba(20,12,40,0.85)'; rr(20, y, W - 40, h, 20); ctx.fill();
  ctx.strokeStyle = '#ffd34d'; ctx.lineWidth = 3; ctx.stroke();
  ctx.font = `800 22px ${FB}`; ctx.textAlign = 'left'; ctx.fillStyle = '#ffffff';
  const all = wrapLines(text, W - 90); let left = shown;
  all.forEach((line, i) => { if (left <= 0) return; ctx.fillText(line.slice(0, left), 44, y + 42 + i * 30); left -= line.length + 1; });
  if (done && Math.sin(T * 6) > -0.3) { ctx.font = `700 14px ${FB}`; ctx.textAlign = 'right'; ctx.fillStyle = '#ffd34d'; ctx.fillText('toque para continuar ›', W - 40, y + h - 16); }
}
function drawButton(label, x, y, w, h, bg, fg, fn) {
  ctx.fillStyle = 'rgba(0,0,0,0.18)'; rr(x, y + 4, w, h, h / 2); ctx.fill();
  ctx.fillStyle = bg; rr(x, y, w, h, h / 2); ctx.fill();
  ctx.font = `20px ${FD}`; ctx.textAlign = 'center'; ctx.fillStyle = fg; ctx.fillText(label, x + w / 2, y + h / 2 + 7);
  uiButtons.push({ x, y: y + uiOY, w, h, fn });
}
function drawTitle() {
  camY = groundCam(); drawWorld(camY);
  const bob = Math.abs(Math.sin(T * 3)) * 26;
  drawBall(W / 2, -16 - bob - camY, 32, { sq: bob < 3 ? 1.15 : 0.95, lookY: -0.6 });
  ctx.textAlign = 'center';
  ctx.font = `30px ${FD}`; outlined('A GRANDE SUBIDA DA', W / 2, 190, '#ffffff', '#1d4f8a', 8);
  ctx.font = `66px ${FD}`; outlined('BOLINHA', W / 2, 258, '#7dff9a', '#0d5a25', 12);
  ctx.font = `66px ${FD}`; outlined('VERDE', W / 2, 322, '#7dff9a', '#0d5a25', 12);
  ctx.font = `800 18px ${FB}`; outlined('Da Terra até o Paraíso', W / 2, 362, '#ffffff', '#1d4f8a', 5);
  ctx.globalAlpha = 0.6 + 0.4 * Math.sin(T * 4);
  drawButton('COMEÇAR', W / 2 - 100, 430, 200, 58, '#ffd34d', '#3a1d5c', advance);
  ctx.globalAlpha = 1;
}
function drawIntro() {
  const s = SCENES[sceneI], gateCam = finalPlat.y - H * 0.72;
  let cam = groundCam();
  if (s.cam === 'gate') cam = gateCam;
  else if (s.cam === 'fly') cam = groundCam() + (gateCam - groundCam()) * ease(clamp((sceneT - 0.6) / (s.d - 1.2), 0, 1));
  camY = cam; drawWorld(cam);
  const bob = Math.abs(Math.sin(T * 3)) * (sceneI === 0 ? 20 : 6);
  if (-cam < H + 100) drawBall(W / 2, -26 - bob - cam, 26, { lookX: s.look ? s.look[0] : 0, lookY: s.look ? s.look[1] : 0, brave: s.brave });
  if (s.controls) {
    ctx.fillStyle = 'rgba(20,12,40,0.88)'; rr(24, 120, W - 48, 420, 22); ctx.fill(); ctx.strokeStyle = '#ffd34d'; ctx.lineWidth = 3; ctx.stroke();
    ctx.textAlign = 'center'; ctx.font = `36px ${FD}`; outlined('COMO JOGAR', W / 2, 172, '#ffd34d', '#3a1d5c', 6);
    const lines = isTouch
      ? [['◀ ▶', 'botões para andar'], ['PULAR', 'um pulo de cada vez'], ['❤ ❤ ❤', 'bateu ou caiu, perde um']]
      : [['← →  ou  A D', 'andar'], ['ESPAÇO  ou  ↑', 'pular (um de cada vez)'], ['❤ ❤ ❤', 'bateu ou caiu, perde um']];
    lines.forEach(([k, d], i) => {
      ctx.font = `22px ${FD}`; ctx.fillStyle = '#7dff9a'; ctx.fillText(k, W / 2, 222 + i * 66);
      ctx.font = `700 17px ${FB}`; ctx.fillStyle = '#ffffff'; ctx.fillText(d, W / 2, 246 + i * 66);
    });
    ctx.font = `700 16px ${FB}`; ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fillText('Perdeu os 3 corações? Volta pro começo do nível.', W / 2, 432);
    ctx.fillText('Suba os 7 níveis e abra o portão do Paraíso!', W / 2, 456);
    drawButton('BORA SUBIR!', W / 2 - 110, 478, 220, 50, '#7dff9a', '#0d4a1f', startPlay);
  } else {
    const shown = Math.floor(sceneT * 42);
    textBox(s.text, shown, sceneTextDone());
    if (s.cam === 'fly') {
      const { i } = levelBlend(cam);
      ctx.textAlign = 'center'; ctx.font = `40px ${FD}`; outlined(LEVELS[i].name, W / 2, 140, '#ffffff', '#3a1d5c', 9);
    }
  }
  drawButton('Pular intro ›', W - 150, 16, 134, 40, 'rgba(20,12,40,0.7)', '#ffffff', startPlay);
}

function newConfetti(y) {
  const cols = ['#ff4d6d', '#ffd34d', '#7dff9a', '#5fd3ff', '#c77dff', '#ffffff', '#ff9f1c'];
  return { x: Math.random() * W, y, vx: (Math.random() - 0.5) * 60, vy: 90 + Math.random() * 120, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 10, c: cols[Math.floor(Math.random() * cols.length)], w: 6 + Math.random() * 6, h: 4 + Math.random() * 6, ph: Math.random() * 6 };
}
function initFinal() {
  confetti = Array.from({ length: 160 }, () => newConfetti(Math.random() * H - H));
  const cols = ['#ff4d6d', '#ffd34d', '#5fd3ff', '#c77dff', '#7dff9a', '#ff9f1c'];
  balloons = Array.from({ length: 7 }, (_, i) => ({ x: 30 + Math.random() * (W - 60), y: H + Math.random() * 600, spd: 40 + Math.random() * 35, c: cols[i % cols.length], ph: Math.random() * 6 }));
}
function drawCake(cx, base) {
  ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.ellipse(cx, base, 120, 18, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#ff8fc0'; rr(cx - 95, base - 80, 190, 80, 14); ctx.fill();
  ctx.fillStyle = '#ffe4f1'; rr(cx - 95, base - 84, 190, 18, 9); ctx.fill();
  for (let k = 0; k < 7; k++) { circle(cx - 80 + k * 27, base - 66, 8); ctx.fill(); }
  ctx.fillStyle = '#ffd34d'; for (let k = 0; k < 9; k++) { circle(cx - 84 + k * 21, base - 30, 4); ctx.fill(); }
  ctx.fillStyle = '#7b4bb3'; rr(cx - 65, base - 140, 130, 60, 12); ctx.fill();
  ctx.fillStyle = '#e9d5ff'; rr(cx - 65, base - 144, 130, 16, 8); ctx.fill();
  for (let k = 0; k < 5; k++) { circle(cx - 52 + k * 26, base - 130, 7); ctx.fill(); }
  for (let k = -1; k <= 1; k++) {
    const x = cx + k * 34;
    ctx.fillStyle = ['#5fd3ff', '#7dff9a', '#ffd34d'][k + 1]; rr(x - 5, base - 182, 10, 40, 3); ctx.fill();
    const fl = Math.sin(T * 18 + k * 2) * 2;
    ctx.fillStyle = '#ffb703'; ctx.beginPath(); ctx.ellipse(x + fl * 0.3, base - 192, 6, 11 + fl, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff3b0'; ctx.beginPath(); ctx.ellipse(x, base - 189, 3, 6, 0, 0, 7); ctx.fill();
  }
}
function drawFinal() {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#ff9ad5'); g.addColorStop(1, '#ffd36b');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.translate(W / 2, 200); ctx.rotate(T * 0.12); ctx.fillStyle = 'rgba(255,255,255,0.18)';
  for (let k = 0; k < 16; k++) { ctx.rotate(Math.PI / 8); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-50, 900); ctx.lineTo(50, 900); ctx.closePath(); ctx.fill(); }
  ctx.restore();
  for (const b of balloons) {
    const sx = b.x + Math.sin(T + b.ph) * 10;
    ctx.strokeStyle = 'rgba(80,40,80,0.5)'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(sx, b.y + 34); ctx.quadraticCurveTo(sx + 8, b.y + 60, sx, b.y + 90); ctx.stroke();
    ctx.fillStyle = b.c; ctx.beginPath(); ctx.ellipse(sx, b.y, 24, 31, 0, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.beginPath(); ctx.ellipse(sx - 8, b.y - 10, 6, 10, -0.4, 0, 7); ctx.fill();
  }
  for (const c of confetti) { ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot); ctx.fillStyle = c.c; ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h); ctx.restore(); }
  // conteúdo desenhado para 800 de altura, centralizado em telas mais altas
  uiOY = Math.max(0, (H - 800) / 2);
  ctx.save(); ctx.translate(0, uiOY);
  ctx.textAlign = 'center';
  const pop = smooth(ft / 0.6);
  ctx.save(); ctx.translate(W / 2, 120); ctx.scale(pop, pop);
  ctx.font = `64px ${FD}`; outlined('FELIZ', 0, 0, '#ffffff', '#7a1d5c', 12); ctx.restore();
  ctx.font = `50px ${FD}`;
  const word = 'ANIVERSÁRIO!', total = ctx.measureText(word).width; let cx = W / 2 - total / 2;
  for (let k = 0; k < word.length; k++) {
    const ch = word[k], cw = ctx.measureText(ch).width, yy = 186 + Math.sin(T * 5 + k * 0.6) * 7;
    ctx.textAlign = 'left'; outlined(ch, cx, yy, `hsl(${(k * 30 + T * 80) % 360},90%,62%)`, '#3a1d5c', 10); cx += cw;
  }
  ctx.textAlign = 'center';
  ctx.font = `34px ${FD}`; outlined(NOME ? `Parabéns, ${NOME}!` : 'Parabéns, mano!', W / 2, 244, '#ffffff', '#7a1d5c', 8);
  ctx.font = `800 19px ${FB}`; ctx.fillStyle = '#4a1440';
  wrapLines('Você subiu da Terra até o Paraíso! Que o seu novo ano seja assim: sempre subindo, sem medo de pular.', W - 70).forEach((l, i) => ctx.fillText(l, W / 2, 286 + i * 26));
  drawCake(W / 2 + 50, 590);
  const bob = Math.abs(Math.sin(T * 4)) * 40;
  drawBall(95, 560 - bob, 34, { hat: true, sq: bob < 4 ? 1.15 : 0.95, lookX: 0.6, lookY: -0.2 });
  ctx.font = `800 17px ${FB}`; ctx.fillStyle = '#4a1440'; ctx.fillText(`Sua subida levou ${fmtTime(playTime)}`, W / 2, 640);
  if (ft > 1.5) {
    drawButton('♪ Parabéns de novo', 28, 664, 206, 52, '#ffffff', '#7a1d5c', () => { initAudio(); playBirthday(); });
    drawButton('Jogar de novo', W - 234, 664, 206, 52, '#7dff9a', '#0d4a1f', () => { resetGame(); startPlay(); });
  }
  ctx.restore(); uiOY = 0;
  if (ft < 1.2) { ctx.fillStyle = `rgba(255,255,255,${1 - ft / 1.2})`; ctx.fillRect(0, 0, W, H); }
}

function draw() {
  uiButtons = [];
  ctx.clearRect(0, 0, W, H);
  if (state === 'title') drawTitle();
  else if (state === 'intro') drawIntro();
  else if (state === 'play') { drawWorld(camY); drawHUD(); }
  else if (state === 'ending') {
    drawWorld(camY);
    if (et < 2.5) { ctx.globalAlpha = 1 - smooth((et - 1.5)); ctx.textAlign = 'center'; ctx.font = `40px ${FD}`; outlined('Você chegou!', W / 2, 150, '#ffffff', '#c7841a', 9); ctx.globalAlpha = 1; }
    if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash})`; ctx.fillRect(0, 0, W, H); }
  }
  else if (state === 'final') drawFinal();
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
